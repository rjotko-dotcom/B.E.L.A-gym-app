<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f7f6" />
  <meta name="description" content="B.E.L.A Gym — workouts, nutrition and progress in one place." />
  <title>B.E.L.A Gym</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    // apply saved theme before first paint (default: light)
    try {
      var s = JSON.parse(localStorage.getItem('bela-gym-v1'));
      if (s && s.settings && s.settings.theme === 'dark') {
        document.documentElement.dataset.theme = 'dark';
        document.querySelector('meta[name="theme-color"]').content = '#0d0d0d';
      }
    } catch (e) {}
  </script>
</head>
<body>
  <main id="view" class="view" tabindex="-1"><!-- views are rendered here --></main>

  <!-- Rest timer bar (hidden until a set is logged) -->
  <div id="restBar" class="rest-bar" hidden>
    <div class="rest-progress"><div id="restFill" class="rest-fill"></div></div>
    <div class="rest-info">
      <span class="rest-label">Rest</span>
      <span id="restTime" class="rest-time">1:30</span>
    </div>
    <div class="rest-actions">
      <button id="restMinus" class="chip-btn" aria-label="Subtract 15 seconds">−15</button>
      <button id="restPlus" class="chip-btn" aria-label="Add 15 seconds">+15</button>
      <button id="restSkip" class="chip-btn chip-strong" aria-label="Skip rest">Skip</button>
    </div>
  </div>

  <nav class="tab-bar" aria-label="Main">
    <button class="tab active" data-tab="home" aria-label="Home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.75 12 3.5l9 7.25"/><path d="M5.25 9.5V20a.75.75 0 0 0 .75.75h4v-6h4v6h4a.75.75 0 0 0 .75-.75V9.5"/></svg>
      <span>Home</span>
    </button>
    <button class="tab" data-tab="workout" aria-label="Workouts">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 7.5v9"/><path d="M3.5 9.5v5"/><path d="M17.5 7.5v9"/><path d="M20.5 9.5v5"/><path d="M6.5 12h11"/></svg>
      <span>Workouts</span>
    </button>
    <button class="tab" data-tab="meals" aria-label="Meals">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9c0-2.9 3.6-4.75 8-4.75S20 6.1 20 9H4Z"/><path d="M3.5 12.5h17"/><path d="M4.5 16h15c0 2-1.6 3.5-3.75 3.5h-7.5C6.1 19.5 4.5 18 4.5 16Z"/></svg>
      <span>Meals</span>
    </button>
    <button class="tab" data-tab="progress" aria-label="Progress">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 7H21v5.5"/><path d="M21 7l-8 8-4.5-4.5L3 16"/></svg>
      <span>Progress</span>
    </button>
  </nav>

  <div id="sheetRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>

  <script src="js/exercises.js"></script>
  <script src="js/foods.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
  </script>
</body>
</html>
