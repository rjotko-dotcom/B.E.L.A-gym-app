<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- both variants exist so Android applies the color in system dark mode too;
       the script + app keep them in sync with the in-app theme toggle -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f7f6" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#f7f7f6" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="B.E.L.A Gym — workouts, nutrition and progress in one place." />
  <title>B.E.L.A Gym</title>
  <link rel="manifest" href="manifest.webmanifest?v=5" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css?v=7.6" />
  <script>
    // apply saved appearance before first paint (default: follow the device)
    try {
      var s = JSON.parse(localStorage.getItem('bela-gym-v1'));
      var a = (s && s.settings && (s.settings.appearance || (s.settings.theme === 'dark' ? 'dark' : ''))) || 'system';
      if (a === 'dark' || a === 'light') document.documentElement.dataset.theme = a;
      document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
        var mediaDark = (m.getAttribute('media') || '').indexOf('dark') !== -1;
        m.content = a === 'system' ? (mediaDark ? '#000000' : '#f7f7f6') : (a === 'dark' ? '#000000' : '#f7f7f6');
      });
    } catch (e) {}
  </script>
</head>
<body>
  <main id="view" class="view" tabindex="-1"><!-- views are rendered here --></main>

  <!-- Rest timer bar (hidden until a set is logged) -->
  <div id="restBar" class="rest-bar" hidden>
    <div class="rest-progress"><div id="restFill" class="rest-fill"></div></div>
    <div class="rest-info">
      <span class="rest-label">Rest</span>
      <span id="restTime" class="rest-time">1:30</span>
    </div>
    <div class="rest-actions">
      <button id="restMinus" class="chip-btn" aria-label="Subtract 15 seconds">−15</button>
      <button id="restPlus" class="chip-btn" aria-label="Add 15 seconds">+15</button>
      <button id="restSkip" class="chip-btn chip-strong" aria-label="Skip rest">Skip</button>
    </div>
  </div>

  <nav class="tab-bar" aria-label="Main">
    <button class="tab active" data-tab="home" aria-label="Home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.2 10.7 12 4.4l7.8 6.3v8a1.5 1.5 0 0 1-1.5 1.5H5.7a1.5 1.5 0 0 1-1.5-1.5Z"/></svg>
      <span class="tab-label">Home</span>
    </button>
    <button class="tab" data-tab="workout" aria-label="Workouts">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.3 9.7v4.6M7.5 7.3v9.4M16.5 7.3v9.4M19.7 9.7v4.6M7.5 12h9"/></svg>
      <span class="tab-label">Workouts</span>
    </button>
    <button class="tab" data-tab="meals" aria-label="Nutrition">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.8 3.6v6.2a2.1 2.1 0 0 1-4.2 0V3.6M5.7 9.9v10.5"/><path d="M17.6 3.6c-1.5 1.6-2.2 3.2-2.2 5.2 0 1.6.7 2.6 2.2 2.9v8.8"/></svg>
      <span class="tab-label">Nutrition</span>
    </button>
    <button class="tab" data-tab="habits" aria-label="Habits">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4.7h12A1.3 1.3 0 0 1 19.3 6v12a1.3 1.3 0 0 1-1.3 1.3H6A1.3 1.3 0 0 1 4.7 18V6A1.3 1.3 0 0 1 6 4.7Z"/><path d="M8.7 12.2l2.4 2.4 4.2-5"/></svg>
      <span class="tab-label">Habits</span>
    </button>
  </nav>
  <div id="workoutRoot"></div>
  <div id="sheetRoot"></div>
  <div id="scanRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>

  <script src="js/exercises.js?v=7.6"></script>
  <script src="js/foods.js?v=7.6"></script>
  <script src="js/app.js?v=7.6"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then((reg) => {
          reg.update(); // check for a new version on every launch
          // keep checking: a deploy can land while the app is already open,
          // and the CDN may serve the old files for a few minutes after it
          setInterval(() => reg.update(), 60000);
          addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') reg.update();
          });
          reg.addEventListener('updatefound', () => {
            const nw = reg.installing;
            if (!nw) return;
            nw.addEventListener('statechange', () => {
              if (nw.state === 'activated' && navigator.serviceWorker.controller) {
                // new version downloaded and cached — offer a one-tap restart
                const root = document.getElementById('toastRoot');
                if (root.querySelector('.update-toast')) return;
                const b = document.createElement('button');
                b.className = 'toast update-toast';
                b.style.pointerEvents = 'auto';
                b.style.cursor = 'pointer';
                b.style.border = 'none';
                b.textContent = '⬆ Update ready — tap to restart';
                b.onclick = () => location.reload();
                root.appendChild(b);
              }
            });
          });
        });
      });
    }
  </script>
</body>
</html>
