name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/mobile-gym-app-51sus5, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      # configure-pages intentionally omitted: Pages is already enabled, and
      # fetching that action has been a flaky point of failure
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # GitHub Pages returns 503 during their outages, so retry with backoff
      # instead of failing an otherwise-valid build
      - id: try1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - if: steps.try1.outcome == 'failure'
        run: sleep 120

      - id: try2
        if: steps.try1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - if: steps.try1.outcome == 'failure' && steps.try2.outcome == 'failure'
        run: sleep 300

      - id: try3
        if: steps.try1.outcome == 'failure' && steps.try2.outcome == 'failure'
        uses: actions/deploy-pages@v4
