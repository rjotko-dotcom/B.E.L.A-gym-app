# Builds the Android app on GitHub's machines, so nothing has to be installed
# on your PC — the finished APK comes out the other end as a download.

name: Android app

on:
  push:
    branches: [claude/mobile-gym-app-51sus5, main]
    paths-ignore:
      - '**/*.md'
      - 'pc/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # the Capacitor CLI refuses to run on anything older
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Build the web app and copy it into the shell
        run: npm run native:sync

      # The key lives in the repository secrets, base64'd so it survives being
      # a text field. Without it we still build, but only as a throwaway.
      - name: Is there a signing key?
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/bela.keystore"
            echo "have=yes" >> "$GITHUB_OUTPUT"
          else
            echo "have=no" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — building an unsigned test APK and not publishing it."
          fi

      - name: Build the APK
        env:
          BELA_KEYSTORE_PATH: ${{ steps.key.outputs.have == 'yes' && format('{0}/bela.keystore', runner.temp) || '' }}
          BELA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BELA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BELA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Name it after the version
        id: apk
        run: |
          V=$(node -p "require('./package.json').version")
          SRC=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$SRC" || { echo "no APK was produced"; exit 1; }
          OUT="bela-$V.apk"
          cp "$SRC" "$OUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          ls -la "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: bela-${{ steps.apk.outputs.version }}-apk
          path: ${{ steps.apk.outputs.file }}
          retention-days: 90

      # Only a properly signed build gets published. A debug-signed APK cannot
      # be upgraded over later, so it must never be the one you install.
      - name: Publish it as a release
        if: steps.key.outputs.have == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.apk.outputs.version }}
          FILE: ${{ steps.apk.outputs.file }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" \
              --title "B.E.L.A ${{ steps.apk.outputs.version }}" \
              --notes "Open this page on the phone and tap the .apk to install. It upgrades over the previous version and keeps your data."
          fi
