apply plugin: 'com.android.application'

/* ---------- the signing key ----------
   A release APK has to be signed with a key that never changes, or Android
   refuses to install the next build over the last one. The key itself is never
   in this repo. It comes from one of two places:

     - android/keystore.properties on your own machine (git-ignored), or
     - BELA_KEYSTORE_PATH and friends in the environment, which is how the
       GitHub Actions build gets it out of the repository secrets.

   With neither, the release build falls back to the debug key so it still
   builds and installs — but it is not upgradable, so the build says so and CI
   refuses to publish it. */
def keystoreProps = rootProject.file('keystore.properties')
def signStore = null
def signStorePassword = null
def signKeyAlias = null
def signKeyPassword = null

if (keystoreProps.exists()) {
    def props = new Properties()
    keystoreProps.withInputStream { props.load(it) }
    if (props['storeFile']) {
        signStore = file(props['storeFile'])
        signStorePassword = props['storePassword']
        signKeyAlias = props['keyAlias']
        signKeyPassword = props['keyPassword']
    }
} else if (System.getenv('BELA_KEYSTORE_PATH')) {
    signStore = file(System.getenv('BELA_KEYSTORE_PATH'))
    signStorePassword = System.getenv('BELA_KEYSTORE_PASSWORD')
    signKeyAlias = System.getenv('BELA_KEY_ALIAS')
    signKeyPassword = System.getenv('BELA_KEY_PASSWORD')
}

def haveSigningKey = signStore != null && signStore.exists()
if (!haveSigningKey) {
    logger.lifecycle('B.E.L.A: no release key found — release builds will use the debug key.')
}

android {
    namespace = "com.rjotko.bela"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.rjotko.bela"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 150000
        versionName "15.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (haveSigningKey) {
            release {
                storeFile signStore
                storePassword signStorePassword
                keyAlias signKeyAlias
                keyPassword signKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig haveSigningKey ? signingConfigs.release : signingConfigs.debug
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
